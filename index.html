<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EAF1F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1A1D" media="(prefers-color-scheme: dark)">
<meta name="description" content="跟著動畫一區一區刷牙，完成後累積連續天數、徽章和夥伴。">
<title>護牙日課</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="護牙日課">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M7.2 4.6c1.6-1.1 3.6-.6 4.8.3 1.2-.9 3.2-1.4 4.8-.3 2.1 1.4 1.7 4.4.9 6.6-.6 1.7-.9 3.7-1.4 5.3-.4 1.2-1.5 1.5-2 .3-.5-1.3-.7-3-1.3-3.8-.4-.5-.9-.5-1.3 0-.6.8-.8 2.5-1.3 3.8-.5 1.2-1.6.9-2-.3-.5-1.6-.8-3.6-1.4-5.3-.8-2.2-1.2-5.2.9-6.6z' fill='%230E5560'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: one phone-width column. Today / Records / Shop / Settings sit under a bottom bar;
   the brushing session takes over the whole screen. Bathroom-tile ground, coral for the zone
   being brushed, teal for finished zones, amber for cleaning points. */
:root{
  --bg:#EAF1F2; --grid:#DDE8EA; --surface:#FFFFFF; --surface-2:#F3F8F9; --line:#CBDADD;
  --ink:#11292F; --muted:#587278;
  --brand:#0E5560; --on-brand:#FFFFFF;
  --active:#E8553E; --active-soft:#FBDAD3;
  --done:#17A08F; --done-soft:#C4EAE4;
  --coin:#E3A21A; --coin-soft:#FBEBC4;
  --tooth:#FAFDFD; --tooth-2:#E6EFF1; --tooth-edge:#B5CACF; --wire:#7F9299;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Nunito","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A1D; --grid:#12252A; --surface:#14272B; --surface-2:#1A3136; --line:#2A444A;
    --ink:#E6F2F3; --muted:#93AEB3;
    --brand:#2BB3C1; --on-brand:#06242A;
    --active:#FF7A63; --active-soft:#4A2620;
    --done:#35C3B0; --done-soft:#17433F;
    --coin:#F2BE45; --coin-soft:#4A3A12;
    --tooth:#E3EFF0; --tooth-2:#C4D8DA; --tooth-edge:#6C8F95; --wire:#A9BDC2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1A1D; --grid:#12252A; --surface:#14272B; --surface-2:#1A3136; --line:#2A444A;
  --ink:#E6F2F3; --muted:#93AEB3;
  --brand:#2BB3C1; --on-brand:#06242A;
  --active:#FF7A63; --active-soft:#4A2620;
  --done:#35C3B0; --done-soft:#17433F;
  --coin:#F2BE45; --coin-soft:#4A3A12;
  --tooth:#E3EFF0; --tooth-2:#C4D8DA; --tooth-edge:#6C8F95; --wire:#A9BDC2;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;color:var(--ink);font:16px/1.55 var(--font-body);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
:focus-visible{outline:3px solid var(--active);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

.shell{max-width:520px;margin:0 auto;padding-block:16px 108px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;font-size:20px;letter-spacing:.04em}
.pills{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:900;font-size:16px}
.pill svg{width:20px;height:20px}
.pill.streak svg{color:var(--active)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:17px;font-weight:900}
.muted{color:var(--muted)}
.small{font-size:13px}

.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:4px 2px}
.hero h1{font-size:28px;font-weight:900;line-height:1.2}
.hero p{color:var(--muted);margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;padding:3px 12px;border-radius:999px;font-size:14px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{border:0;background:transparent;border-radius:12px;min-height:44px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.btn{min-height:52px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 18px}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:transparent}
.btn.big{min-height:64px;font-size:20px;font-weight:900;width:100%}
.btn.ghost{background:transparent}
.btn.danger{background:var(--active);color:#fff;border-color:transparent}
.btn:disabled{opacity:.55;cursor:default}
.btn-sub{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:2px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn svg{width:22px;height:22px}

.chk{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chk li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.chk .dot{width:38px;height:38px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--on-brand)}
.chk .dot svg{width:20px;height:20px}
.chk li.on{color:var(--ink)}
.chk li.on .dot{background:var(--done);border:2px solid var(--done)}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--coin);border-radius:999px}
.row-between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:12px;font-weight:700}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--brand);background:var(--surface-2)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head h3{font-family:var(--font-num);font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.cal button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;background:transparent;font:700 14px var(--font-num);color:var(--ink);padding:0}
.cal button.h{background:var(--done-soft);border-color:var(--done-soft)}
.cal button.f{background:var(--done);color:var(--on-brand);border-color:var(--done)}
.cal button.p{background:var(--done);color:var(--on-brand);border-color:var(--done);box-shadow:0 0 0 2px var(--coin)}
.cal button.today{border-color:var(--ink)}
.cal button.sel{outline:2px solid var(--brand);outline-offset:2px}
.cal button.fut{color:var(--muted);opacity:.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.stats{display:flex;gap:20px;flex-wrap:wrap}
.stats b{font-family:var(--font-num);font-size:26px;font-weight:900;margin-right:4px}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}
.medal{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.medal svg{width:64px;height:64px}
.medal b{font-size:14px}
.medal small{color:var(--muted);font-size:12px;line-height:1.35}
.medal.locked b{color:var(--muted)}

/* shop + settings */
.shop-row{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center}
.shop-row .act{grid-column:1 / -1;display:flex;flex-direction:column;gap:8px}
.shop-row h3{font-size:17px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{font-family:var(--font-num);font-size:28px;min-width:3.2ch;text-align:center}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px}
.setting > div:first-child{min-width:0}
.switch{width:56px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-pressed="true"]{background:var(--done);border-color:var(--done)}
.switch[aria-pressed="true"]::after{transform:translateX(24px);background:#fff}
input[type="date"],input[type="url"]{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px}
input[type="url"]{width:100%}
.field{display:flex;flex-direction:column;gap:6px}

/* buddies */
.buddy{display:inline-block;line-height:0;flex:none}
.buddy svg{width:100%;height:100%;overflow:visible}
.buddy.s{width:84px;height:84px}
.buddy.m{width:104px;height:104px}
.buddy.l{width:148px;height:148px}
.buddy .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.buddy .brush{display:none}
.buddy.scrub .brush{display:block;animation:scrub .45s ease-in-out infinite alternate}
.buddy.float svg{animation:bob 3.2s ease-in-out infinite}
.buddy.cheer svg{animation:hop .7s ease-in-out infinite alternate}
.paused .buddy .brush{animation-play-state:paused}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes scrub{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hop{to{transform:translateY(-10px)}}

/* arch drawing */
.arch{width:100%;height:100%;display:block}
.band{fill:var(--tooth);transition:fill .2s}
.band.c{fill:var(--tooth-2)}
.band.done{fill:var(--done)}
.band.active{fill:var(--active);animation:pulse .9s ease-in-out infinite alternate}
.edge{fill:none;stroke:var(--tooth-edge);stroke-width:1.2}
.lbl{font:700 10px var(--font-body);fill:var(--muted)}
.wire{fill:none;stroke:var(--wire);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.wire-dot{fill:var(--wire)}
.gap{stroke-width:3;stroke-linecap:round}
.gap.floss{stroke:var(--done)}
.gap.skip{stroke:var(--wire);stroke-dasharray:.1 5.5}
.gap.inter{stroke:var(--active)}
.gap.todo{stroke:var(--tooth-edge);stroke-dasharray:.1 5.5}
.band.inr{fill:var(--brand)}
.band.pend{fill:var(--active)}
rect.pk{fill:transparent;cursor:pointer}
.pickwrap{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.pickbox{position:relative;height:190px}
.pickbox .arch{position:absolute;inset:0}
.gap.done{stroke:var(--done);stroke-dasharray:none}
.gap.act{stroke:var(--active);stroke-dasharray:none;stroke-width:5;animation:pulse .9s ease-in-out infinite alternate}
details.how{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
details.how summary{font-weight:700;cursor:pointer;min-height:28px}
details.how ol{margin:8px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
details.how .src{margin-top:8px}
a{color:var(--brand)}
.foot{text-align:center;padding-top:4px}
@keyframes pulse{from{opacity:.72}to{opacity:1}}
/* floss demo */
.demo{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px}
.demo svg{width:100%;height:auto;max-height:min(150px,20vh);display:block}
.fl{opacity:0}
.fl-line{fill:none;stroke:var(--active);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.hand{fill:#E8B796;stroke:#16353C;stroke-width:2}
.fl-a{animation:fa 10s linear infinite}
.fl-b{animation:fb 10s linear infinite}
.fl-c{animation:fcc 10s linear infinite}
.dm-saw{animation:dmsaw .35s ease-in-out infinite alternate}
.dm-scrub{animation:dmscrub 1.1s ease-in-out infinite alternate}
.fl-arrow{opacity:0;animation:farrow 10s linear infinite}
.capbox{position:relative;height:46px}
.cap{position:absolute;inset:0;margin:0;font-weight:700;font-size:15px;opacity:0;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.35}
.c1{animation:cp1 10s linear infinite}
.c2{animation:cp2 10s linear infinite}
.c3{animation:cp3 10s linear infinite}
@keyframes fa{0%{opacity:1;transform:translateY(-36px)}12%{opacity:1;transform:translateY(0)}26%{opacity:1;transform:translateY(0)}28%,100%{opacity:0;transform:translateY(0)}}
@keyframes fb{0%,26%{opacity:0}28%,62%{opacity:1}64%,100%{opacity:0}}
@keyframes fcc{0%,62%{opacity:0}64%,94%{opacity:1}96%,100%{opacity:0}}
@keyframes dmsaw{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
@keyframes dmscrub{from{transform:translateY(-24px)}to{transform:translateY(0)}}
@keyframes farrow{0%,26%{opacity:0}28%,94%{opacity:1}96%,100%{opacity:0}}
@keyframes cp1{0%,26%{opacity:1}28%,100%{opacity:0}}
@keyframes cp2{0%,26%{opacity:0}28%,62%{opacity:1}64%,100%{opacity:0}}
@keyframes cp3{0%,62%{opacity:0}64%,94%{opacity:1}96%,100%{opacity:0}}

/* session overlay */
#overlay{position:fixed;inset:0;z-index:50;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;display:flex;justify-content:center}
.sess{width:100%;max-width:520px;height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.s-top{display:flex;align-items:center;gap:12px}
.s-prog{flex:1;height:10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.s-prog i{display:block;height:100%;width:0;background:var(--done);border-radius:999px}
.s-count{font-weight:900;font-size:15px;min-width:5ch;text-align:right}
.s-label{flex:1;font-weight:900;font-size:17px}
.s-zone{display:flex;flex-direction:column;gap:6px}
.s-zone .chip.j{background:var(--brand);color:var(--on-brand);border-color:transparent}
.s-zone .chip.s{background:var(--active-soft);border-color:var(--active-soft)}
.s-name{font-size:22px;font-weight:900;line-height:1.25}
.s-arch{position:relative;flex:1 1 auto;min-height:190px}
.s-arch.sm{flex:0 0 auto;height:clamp(132px,24vh,200px);min-height:0}
.s-arch .arch{position:absolute;inset:0}
.s-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.ring{position:relative;width:112px;height:112px}
.ring svg{width:100%;height:100%}
.r-bg{fill:none;stroke:var(--line);stroke-width:8}
.r-fg{fill:none;stroke:var(--active);stroke-width:8;stroke-linecap:round;stroke-dasharray:276.46;stroke-dashoffset:0}
.r-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.r-txt b{font-size:44px;font-weight:900}
.r-txt small{font-size:12px;color:var(--muted);margin-top:4px}
.s-buddy{display:flex;align-items:center;gap:8px;min-width:0}
.bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 12px;font-size:14px;line-height:1.45;min-width:0}
.s-ctl{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px}
.s-ctl2{display:flex;flex-direction:column;gap:10px}
.sheet{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,25,28,.55);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-card{width:100%;max-width:520px;background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.s-body{display:flex;flex-direction:column;gap:14px;flex:1}
.s-body h2{font-size:22px;font-weight:900;line-height:1.3}
.archpair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.archpair figure{margin:0;display:flex;flex-direction:column;gap:6px}
.archpair .box{height:150px}
.archpair figcaption{font-size:12px;color:var(--muted);line-height:1.4}
.big-arch{height:min(42vh,300px);min-height:200px}
.prep{display:flex;flex-direction:column;align-items:center;gap:14px;flex:1;text-align:center;padding-top:8px}
.prep h2{font-size:26px;font-weight:900}
.plan{list-style:none;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.plan li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:2px 12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;align-items:center}
.plan li::before{content:counter(st);grid-row:1 / span 2;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:900 16px var(--font-num)}
.plan b{font-size:16px}
.plan span{font-size:14px;color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}
.cd{font:900 132px/1 var(--font-num);color:var(--active);margin:8px 0}
.cd.pop{animation:cdpop .9s ease-out}
@keyframes cdpop{from{transform:scale(1.35);opacity:.3}to{transform:scale(1);opacity:1}}
/* countdown cheer: each buddy has its own move, replayed on every number */
.cd-buddy{display:flex;flex-direction:column;align-items:center;gap:10px}
.cd-buddy .bubble{font-weight:700;font-size:16px;text-align:center}
.cd-buddy .buddy svg{transform-origin:50% 90%}
.cd-buddy.go.tooth .buddy svg{animation:cdhop .8s ease-out}
.cd-buddy.go.bubble .buddy svg{animation:cdsquish .8s ease-in-out}
.cd-buddy.go.otter .buddy svg{animation:cdwiggle .8s ease-in-out}
.cd-buddy.go.dino .buddy svg{animation:cdstomp .8s ease-out}
.cd-buddy.go.astro .buddy svg{animation:cdlaunch .8s ease-in-out}
.cd-buddy.go .bubble{animation:cdpop .5s ease-out}
.cd-buddy.last.astro .buddy svg{animation:cdblast .9s ease-in forwards}

    [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(function(c){
      var lx=c[0]*t.w/2, ly=c[1]*t.d/2;
      var X=t.x+Math.cos(t.th)*lx-Math.sin(t.th)*ly, Y=t.y+Math.sin(t.th)*lx+Math.cos(t.th)*ly;
      x0=Math.min(x0,X); x1=Math.max(x1,X); y0=Math.min(y0,Y); y1=Math.max(y1,Y);
    });
  });
  var vb=[x0-18,y0-12,(x1-x0)+36,(y1-y0)+12+32].map(function(v){return +v.toFixed(1);}).join(' ');
  var gaps=bnd.map(function(sv,k){
    var p=pos(sv), L=((Dp[k]+Dp[k+1])/2)+8;
    return {k:k,x1:p.x+Math.sin(p.th)*L/2,y1:p.y-Math.cos(p.th)*L/2,x2:p.x-Math.sin(p.th)*L/2,y2:p.y+Math.cos(p.th)*L/2};
  });
  function wireFor(a,b){
    var o=[],i,t,yl;
    for(i=a;i<=b;i++){ t=teeth[i]; yl=t.d/2-1.2; o.push([t.x-Math.sin(t.th)*yl, t.y+Math.cos(t.th)*yl]); }
    return o;
  }
  return {teeth:teeth,gaps:gaps,vb:vb,wireFor:wireFor,
    lblR:{x:teeth[0].x,y:teeth[0].y+30}, lblL:{x:teeth[n-1].x,y:teeth[n-1].y+30}};
}
function f1(n){return n.toFixed(2);}
function nOf(j){return S.settings.teeth[j];}
function halfOf(j){return nOf(j)/2;}
function canR(j){return halfOf(j)-3;}
function canL(j){return halfOf(j)+2;}
function toothSide(j,i){return i<halfOf(j)?'右邊':'左邊';}
function toothShort(j,i){var h=halfOf(j);return HALF[nOf(j)].names[i<h?i:nOf(j)-1-i];}
function toothName(j,i){return toothSide(j,i)+toothShort(j,i);}
function retOf(j){return (S.settings.ret&&S.settings.ret[j])||{on:false,from:canR(j),to:canL(j)};}
function retOn(j){return !!retOf(j).on;}
function anyRet(){return retOn('u')||retOn('l');}
function retA(j){var r=retOf(j);return Math.min(r.from,r.to);}
function retB(j){var r=retOf(j);return Math.max(r.from,r.to);}
function retGaps(j){var a=retA(j),b=retB(j),o=[],k;for(k=a;k<b;k++)o.push(k);return o;}
function isRetGap(j,k){return retOn(j) && k>=retA(j) && k<retB(j);}
function isRetPair(j,p){return retOn(j) && p+1>=retA(j) && p<=retB(j);}
function jawName(j){return j==='u'?'上排':'下排';}
function pairGaps(jaw,ks){
  var out=[],i,j,g,c=halfOf(jaw)-1;
  var L=ks.filter(function(k){return k<c;}), M=ks.filter(function(k){return k===c;}), R=ks.filter(function(k){return k>c;});
  for(i=L.length-1;i>=0;i-=2){ g=[L[i]]; if(i-1>=0) g.unshift(L[i-1]); out.unshift(g); }
  if(M.length) out.push(M);
  for(j=0;j<R.length;j+=2) out.push(R.slice(j,j+2));
  return out;
}
function gapGroupName(j,g){
  var a=g[0], b=g[g.length-1]+1;
  if(a===halfOf(j)-1&&b===halfOf(j)) return '中間兩顆門牙之間';
  if(toothSide(j,a)===toothSide(j,b)) return toothSide(j,a)+toothShort(j,a)+'到'+toothShort(j,b);
  return toothName(j,a)+'到'+toothName(j,b);
}
function archSVG(pre,jaw,opt){
  opt=opt||{};
  var G=geoFor(nOf(jaw)), s='<svg class="arch" viewBox="'+G.vb+'" role="img" aria-label="'+(jaw==='u'?'上排':'下排')+'牙齒示意圖"><defs>';
  G.teeth.forEach(function(t,i){
    s+='<clipPath id="'+pre+'c'+i+'"><rect x="'+(-t.w/2)+'" y="'+(-t.d/2)+'" width="'+t.w+'" height="'+t.d+'" rx="'+t.r+'"/></clipPath>';
  });
  s+='</defs><g transform="scale(-1 1)">';
  G.teeth.forEach(function(t,i){
    var x=-t.w/2, y=-t.d/2;
    s+='<g transform="translate('+f1(t.x)+' '+f1(t.y)+') rotate('+f1(t.deg)+')"><g clip-path="url(#'+pre+'c'+i+')">'+
      '<rect id="'+pre+'b-'+i+'-o" class="band o" x="'+x+'" y="'+y+'" width="'+t.w+'" height="'+t.bo+'"/>'+
      '<rect id="'+pre+'b-'+i+'-c" class="band c" x="'+x+'" y="'+(y+t.bo)+'" width="'+t.w+'" height="'+t.bc+'"/>'+
      '<rect id="'+pre+'b-'+i+'-n" class="band n'+(opt.pick?((pickFrom&&pickFrom.j===jaw&&pickFrom.i===i)?' pend':(retOn(jaw)&&i>=retA(jaw)&&i<=retB(jaw)?' inr':'')):'')+'" x="'+x+'" y="'+(y+t.bo+t.bc)+'" width="'+t.w+'" height="'+t.bn+'"/></g>'+
      '<rect class="edge" x="'+x+'" y="'+y+'" width="'+t.w+'" height="'+t.d+'" rx="'+t.r+'"/>'+
      (opt.pick?'<rect class="pk" data-act="pickTooth" data-j="'+jaw+'" data-i="'+i+'" x="'+x+'" y="'+y+'" width="'+t.w+'" height="'+t.d+'" rx="'+t.r+'"><title>'+toothName(jaw,i)+'</title></rect>':'')+'</g>';
  });
  if(opt.gaps){
    G.gaps.forEach(function(gp){
      var wireGap=(opt.wire!==false&&isRetGap(jaw,gp.k)), cls=null;
      if(opt.gaps==='floss') cls=wireGap?'skip':'floss';
      else if(opt.gaps==='seq') cls=wireGap?'skip':'todo';
      else if(opt.gaps==='seqi'){ if(wireGap) cls='todo'; }
      else if(opt.gaps==='inter' && wireGap) cls='inter';
      if(cls) s+='<line id="'+pre+'g-'+gp.k+'" class="gap '+cls+'" x1="'+f1(gp.x1)+'" y1="'+f1(gp.y1)+'" x2="'+f1(gp.x2)+'" y2="'+f1(gp.y2)+'"/>';
    });
  }
  var txt='';
  if(opt.wire!==false && retOn(jaw)){
    var wp=G.wireFor(retA(jaw),retB(jaw)), lx=0, ly=-1e9;
    wp.forEach(function(p){ lx+=p[0]; ly=Math.max(ly,p[1]); });
    s+='<polyline class="wire" points="'+wp.map(function(p){return f1(p[0])+','+f1(p[1]);}).join(' ')+'"/>';
    [wp[0],wp[wp.length-1]].forEach(function(p){ s+='<circle class="wire-dot" cx="'+f1(p[0])+'" cy="'+f1(p[1])+'" r="2.800"/>'; });
    txt+='<text class="lbl" x="'+f1(-lx/wp.length)+'" y="'+f1(ly+16)+'" text-anchor="middle">維持器</text>';
  }
  s+='</g>'+txt;
  s+='<text class="lbl" x="'+f1(-G.lblR.x)+'" y="'+f1(G.lblR.y)+'" text-anchor="middle">右</text>';
  s+='<text class="lbl" x="'+f1(-G.lblL.x)+'" y="'+f1(G.lblL.y)+'" text-anchor="middle">左</text>';
  return s+'</svg>';
}

/* ---------- zones ---------- */
function pairName(j,p){
  if(p===halfOf(j)-1) return '中間兩顆門牙';
  return toothSide(j,p)+toothShort(j,p)+'和'+toothShort(j,p+1);
}
var SURF={o:'外側',n:'內側',c:'咬合面'};
/* each zone is two neighbouring teeth: 1-2, 3-4, 5-6 ... */
/* order: lower jaw first, then upper. Each jaw goes once around: inside from the right
   back tooth to the left back tooth, outside back again, then the chewing surfaces */
function buildZones(){
  var z=[];
  ['l','u'].forEach(function(j){
    var n=nOf(j), h=halfOf(j), p;
    for(p=0;p<n-1;p+=2) z.push({jaw:j,surf:'n',p:p});
    for(p=n-2;p>=0;p-=2) z.push({jaw:j,surf:'o',p:p});
    /* chewing surfaces: pairs that include a molar or premolar (behind the canines) */
    for(p=0;p<n-1;p+=2){ if(p<=h-4||p>=n-h+2) z.push({jaw:j,surf:'c',p:p}); }
  });
  return z;
}
function zoneN(j){ return buildZones().filter(function(z){return !j||z.jaw===j;}).length; }
function buildInterSteps(){
  var out=[];
  ['u','l'].forEach(function(j){
    if(!retOn(j)) return;
    pairGaps(j,retGaps(j)).forEach(function(g){ out.push({jaw:j,gaps:g,name:gapGroupName(j,g)}); });
  });
  return out;
}
function isFront(j,p){return p>=canR(j)&&p<canL(j);}
function tipFor(z){
  /* manual: modified Bass, short side-to-side strokes about 10 times; electric: hold the head still */
  var manual=S.settings.brushType==='manual';
  var ang='刷毛朝'+(z.jaw==='u'?'上':'下')+'斜 45 度，貼在牙齒和牙齦交界';
  var ret=z.surf==='n'&&isRetPair(z.jaw,z.p), front=z.surf==='n'&&isFront(z.jaw,z.p);
  if(z.surf==='c') return manual?'咬合面的溝槽，短距離來回刷 10 下。':'刷頭停在咬合面上，溝槽也要停一下。';
  if(front) return (ret?'這裡有維持器鐵絲，鐵絲上下都要刷到。':'')+(manual?'前牙內側：牙刷打直，貼著牙齦上下刷 10 下。':'前牙內側：牙刷打直，刷頭貼著牙齦停住。');
  if(ret) return '這裡有維持器鐵絲，'+ang+'，鐵絲上下都要刷到'+(manual?'，短距離左右刷 10 下。':'，輕輕停住。');
  return ang+(manual?'，短距離左右刷 10 下，最後幾下往咬合面轉。':'，刷頭停住，不用來回大力刷。');
}

/* ---------- streak, badges ---------- */
function achieved(s){var r=S.days[s];return !!(r&&(r.m||r.e));}
function isPerfect(r){return !!(r&&r.m&&r.e&&r.f&&(r.i||!anyRet()));}
function calcStreak(){
  var t=new Date(), d=new Date(t.getFullYear(),t.getMonth(),t.getDate()), n=0, miss=0, k;
  if(!achieved(ymd(d))) d=addDays(d,-1);
  for(k=0;k<800;k++){
    if(achieved(ymd(d))){n++;miss=0;} else {miss++; if(miss>=2) break;}
    d=addDays(d,-1);
  }
  return n;
}
function streakBest(){return Math.max(S.best||0,calcStreak());}
function nextBadge(){
  var best=null;
  badgeList().forEach(function(b){
    if(b.manual||S.badges[b.id]) return;
    var p=b.prog(), ratio=Math.min(p[0]/p[1],1);
    if(!best||ratio>best.ratio||(ratio===best.ratio&&p[1]<best.goal)) best={b:b,cur:Math.min(p[0],p[1]),goal:p[1],ratio:ratio};
  });
  return best;
}
function finishSession(slot,did){
  var t=todayStr(), r=S.days[t]||(S.days[t]={}), rewards=[], newBadges=[], gain=0, first=false;
  if(!r[slot]){ r[slot]=1; S.totals.brush++; first=true; rewards.push([slot==='m'?'早上刷牙':'晚上刷牙',10]); gain+=10; }
  if(did.floss&&!r.f){ r.f=1; S.totals.floss++; rewards.push(['牙線',5]); gain+=5; }
  if(did.inter&&anyRet()&&!r.i){ r.i=1; S.totals.inter++; rewards.push(['牙間刷',5]); gain+=5; }
  if(isPerfect(r)&&!r.p){ r.p=1; S.totals.perfect++; rewards.push(['完美的一天',10]); gain+=10; }
  var streak=calcStreak(); S.best=Math.max(S.best||0,streak);
  badgeList().forEach(function(b){
    if(b.manual||S.badges[b.id]) return;
    var p=b.prog();
    if(p[0]>=p[1]){ S.badges[b.id]=t; newBadges.push(b); rewards.push(['徽章：'+b.name,b.bonus]); gain+=b.bonus; }
  });
  S.points+=gain;
  save();
  return {rewards:rewards,newBadges:newBadges,streak:streak,count:S.totals.brush,gain:gain,first:first,slot:slot};
}

/* ---------- audio, vibration, wake lock ---------- */
var actx=null, wake=null;
function cue(kind){
  var seqs={zone:[[660,.07]],jaw:[[523,.09],[784,.12]],step:[[587,.1],[880,.14]],done:[[523,.12],[659,.12],[784,.12],[1047,.28]],start:[[440,.08],[660,.1]]};
  if(S.settings.sound&&actx){
    try{
      var tt=actx.currentTime;
      seqs[kind].forEach(function(n){
        var o=actx.createOscillator(), g=actx.createGain();
        o.type='sine'; o.frequency.value=n[0];
        g.gain.setValueAtTime(0.0001,tt);
        g.gain.exponentialRampToValueAtTime(0.18,tt+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001,tt+n[1]);
        o.connect(g); g.connect(actx.destination);
        o.start(tt); o.stop(tt+n[1]+0.02); tt+=n[1]*0.9;
      });
    }catch(e){}
  }
  if(S.settings.vibe){ try{ if(navigator.vibrate) navigator.vibrate(kind==='zone'?25:[40,40,60]); }catch(e){} }
}
function lockScreen(){ try{ if(navigator.wakeLock&&!wake){ navigator.wakeLock.request('screen').then(function(l){wake=l;l.addEventListener('release',function(){wake=null;});}).catch(function(){}); } }catch(e){} }
function unlockScreen(){ try{ if(wake) wake.release(); }catch(e){} wake=null; }

/* ---------- session ---------- */
var sess=null, tickT=null;
function slotNow(){return new Date().getHours()<14?'m':'e';}
var slotSel=slotNow();
function stepsFor(slot){ var a=['brush']; if(S.settings.flossSlot===slot){ a.push('floss'); if(anyRet()) a.push('inter'); } return a; }
function startSession(slot){
  sess={slot:slot,phase:'prep',zones:buildZones(),zi:0,running:false,secPer:S.settings.sec,steps:stepsFor(slot),remain:0,endAt:0,archJaw:null,count:3,seq:{inter:{steps:buildInterSteps(),i:0,aj:null}},quitAsk:false,didFloss:false,didInter:false,result:null};
  renderSession();
}
function stopTick(){ if(tickT){clearInterval(tickT);tickT=null;} }
function endSession(){ stopTick(); unlockScreen(); sess=null; renderSession(); render(); }
function beginBrush(){
  try{
    var AC=W.AudioContext||W.webkitAudioContext;
    if(AC&&!actx) actx=new AC();
    if(actx&&actx.state==='suspended') actx.resume();
  }catch(e){}
  lockScreen();
  sess.phase='count'; renderSession(); startCount();
}
/* 3-2-1 before the first zone; restarts from 3 whenever the page comes back (e.g. from YouTube) */
function startCount(){
  stopTick(); sess.count=3; paintCount();
  tickT=setInterval(function(){
    sess.count--;
    if(sess.count<=0){ stopTick(); startBrush(); } else paintCount();
  },1000);
}
function paintCount(){
  var el=$('#cd'); if(!el) return;
  el.textContent=sess.count; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  var bd=$('#cdb'), msg=$('#cdmsg'), lines=cheerBuddy().cheer;
  if(msg) msg.textContent=lines[Math.max(0,lines.length-sess.count)];
  if(bd){ bd.classList.remove('go','last'); void bd.offsetWidth; bd.classList.add('go'); if(sess.count===1) bd.classList.add('last'); }
  cue('zone');
}
function startBrush(){
  sess.phase='brush'; sess.zi=0; sess.running=true; sess.remain=sess.secPer*1000; sess.endAt=performance.now()+sess.remain;
  cue('start'); renderSession(); stopTick(); tickT=setInterval(tick,100);
}
function ytUrl(){ var y=S.settings.yt; return (y&&y.on&&/^https?:\/\/\S+$/i.test(y.url))?y.url:''; }
function openMusic(){ var u=ytUrl(); if(u){ try{ W.open(u,'_blank','noopener'); }catch(e){} } }
function pause(){ if(!sess||!sess.running) return; sess.remain=Math.max(0,sess.endAt-performance.now()); sess.running=false; setPauseUI(); }
function resume(){ if(!sess||sess.running) return; sess.endAt=performance.now()+sess.remain; sess.running=true; setPauseUI(); }
function setPauseUI(){
  var b=$('#pausebtn'); if(b) b.textContent=sess.running?'暫停':'繼續';
  var s=$('.sess'); if(s) s.classList.toggle('paused',!sess.running);
}
function tick(){
  if(!sess||sess.phase!=='brush'||!sess.running) return;
  if(performance.now()>=sess.endAt) advance();
  paintTimer();
}
function advance(){
  if(sess.zi>=sess.zones.length-1){ brushFinished(); return; }
  var pj=sess.zones[sess.zi].jaw;
  sess.zi++; sess.endAt+=sess.secPer*1000;
  if(sess.endAt<performance.now()) sess.endAt=performance.now()+sess.secPer*1000;
  cue(sess.zones[sess.zi].jaw!==pj?'jaw':'zone'); paintZone();
}
function jump(delta){
  var n=sess.zi+delta;
  if(n<0) return;
  if(n>=sess.zones.length){ brushFinished(); return; }
  var pj=sess.zones[sess.zi].jaw;
  sess.zi=n; sess.remain=sess.secPer*1000; sess.endAt=performance.now()+sess.remain;
  paintZone(); cue(sess.zones[n].jaw!==pj?'jaw':'zone'); paintTimer();
}
function brushFinished(){
  stopTick();
  if(sess.steps.indexOf('floss')>=0){ sess.phase='floss'; cue('step'); renderSession(); }
  else complete();
}
function nextStep(from,did){
  if(from==='floss'){ sess.didFloss=did; }
  if(from==='inter'){ sess.didInter=did; }
  if(from==='floss'&&sess.steps.indexOf('inter')>=0){ sess.phase='inter'; cue('step'); renderSession(); }
  else complete();
}
function complete(){
  cue('done'); unlockScreen(); stopTick();
  sess.result=finishSession(sess.slot,{floss:sess.didFloss,inter:sess.didInter});
  sess.phase='done'; slotSel=slotNow(); renderSession(); render();
}

function mark(z,cls){
  [z.p,z.p+1].forEach(function(i){ var el=document.getElementById('s-b-'+i+'-'+z.surf); if(el) el.classList.add(cls); });
}
function paintZone(){
  var z=sess.zones[sess.zi], arch=$('#arch'); if(!arch) return;
  if(sess.archJaw!==z.jaw){ arch.innerHTML=archSVG('s-',z.jaw,{}); sess.archJaw=z.jaw; }
  arch.querySelectorAll('.band.done,.band.active').forEach(function(n){n.classList.remove('done','active');});
  for(var k=0;k<sess.zi;k++){ if(sess.zones[k].jaw===z.jaw) mark(sess.zones[k],'done'); }
  mark(z,'active');
  $('#zj').textContent=z.jaw==='u'?'上排':'下排';
  $('#zs').textContent=SURF[z.surf];
  $('#zn').textContent=pairName(z.jaw,z.p);
  $('#pcnt').textContent=(sess.zi+1)+' / '+sess.zones.length;
  $('#tip').textContent=tipFor(z);
}
function paintTimer(){
  if(!sess||sess.phase!=='brush') return;
  var el=$('#rsec'); if(!el) return;
  var total=sess.secPer*1000;
  var remain=sess.running?Math.max(0,sess.endAt-performance.now()):sess.remain;
  var frac=Math.min(1,remain/total);
  el.textContent=Math.ceil(remain/1000);
  $('#rfg').style.strokeDashoffset=(276.46*(1-frac)).toFixed(1);
  $('#rtot').textContent='剩 '+mmss((sess.zones.length-sess.zi-1)*sess.secPer+remain/1000);
  $('#pbar').style.width=(((sess.zi+(1-frac))/sess.zones.length)*100).toFixed(1)+'%';
}

     '<button class="icon-btn" data-act="teethInc" data-j="'+j+'" aria-label="'+jawName(j)+'增加兩顆" '+(n>=16?'disabled':'')+'>＋</button></div></div>';
  }).join('');
  return '<div class="card"><h3>牙齒數量</h3><p class="muted small">左右各算一半，一次加減兩顆。16 顆含智齒；14 顆是沒有智齒；12 顆是沒有智齒又拔過小臼齒（矯正常見）。</p>'+rows+'</div>';
}
/* keep the retainer on the same teeth: adding two teeth puts one more at the back of each side */
function setTeeth(j,n){
  var r=S.settings.ret[j], d=(n-nOf(j))/2;
  S.settings.teeth[j]=n;
  r.from=Math.max(0,Math.min(n-1,r.from+d)); r.to=Math.max(0,Math.min(n-1,r.to+d));
  if(r.from===r.to){ r.from=canR(j); r.to=canL(j); }
}
function retainerCard(){
  var rows=['u','l'].map(function(j){
    return '<div class="setting"><div><h3>'+jawName(j)+'</h3><p class="muted small">'+
      (retOn(j)?toothName(j,retA(j))+' 到 '+toothName(j,retB(j))+'，'+retGaps(j).length+' 個牙縫用牙間刷':'沒有，牙縫全部用牙線')+
      '</p></div><button class="switch" data-act="toggleRet" data-j="'+j+'" aria-pressed="'+retOn(j)+'" aria-label="'+jawName(j)+'固定式維持器"></button></div>';
  }).join('');
  return '<div class="card"><h3>固定式維持器</h3><p class="muted small">黏在牙齒內側的鐵絲，上下排都可能有。有鐵絲的那一排，牙線會跳過鐵絲範圍，改用牙間刷。牙間刷選能輕鬆放進牙縫的最大號，太大會傷牙齦，第一次最好請牙醫幫你挑。</p>'+
   rows+['u','l'].filter(retOn).map(retainerPicker).join('')+'</div>';
}
function musicCard(){
  var y=S.settings.yt;
  return '<div class="card"><div class="setting"><div><h3>開始時打開 YouTube 音樂</h3><p class="muted small">按「開始」會同時打開這個連結。播放後回到這裡，倒數 3 秒再開始刷牙。</p></div><button class="switch" data-act="toggleYt" aria-pressed="'+y.on+'" aria-label="開始時打開 YouTube 音樂"></button></div>'+
   (y.on?'<label class="field"><span class="small muted">YouTube 連結</span><input type="url" id="yturl" inputmode="url" autocomplete="off" placeholder="https://www.youtube.com/watch?v=…" value="'+esc(y.url)+'"></label>'+
     (ytUrl()?'':'<p class="small" style="color:var(--active)">還沒有可以用的連結，請貼上 https:// 開頭的 YouTube 網址。</p>'):'')+'</div>';
}
function viewSettings(){
  var st=S.settings;
  return '<div class="top"><span class="brand">設定</span></div>'+
   '<div class="card"><h3>牙刷</h3><div class="seg" role="group" aria-label="牙刷種類"><button data-act="brushType" data-type="electric" aria-pressed="'+(st.brushType==='electric')+'">電動牙刷</button><button data-act="brushType" data-type="manual" aria-pressed="'+(st.brushType==='manual')+'">一般牙刷</button></div>'+
   '<p class="muted small">'+(st.brushType==='manual'?'改良式貝氏刷牙法：刷毛斜 45 度貼著牙齦交界，短距離左右刷 10 下。選中等或軟毛、刷頭小的牙刷，力道放輕。':'每一區提示「刷頭停在牙面上」，不用來回刷。')+'</p>'+
   '<h3>每一區停留</h3><div class="stepper"><button class="icon-btn" data-act="secDec" aria-label="減少一秒">−</button><b>'+st.sec+' 秒</b><button class="icon-btn" data-act="secInc" aria-label="增加一秒">＋</button></div><p class="muted small">上下排共 '+zoneN()+' 區（兩顆一區），全部刷完 '+mmss(zoneN()*st.sec)+'。</p></div>'+
   teethCard()+retainerCard()+
   '<div class="card"><div class="setting"><div><h3>牙線教學動畫</h3><p class="muted small">牙線步驟上方顯示動作示範，關掉就只剩文字說明。</p></div><button class="switch" data-act="toggleAnim" aria-pressed="'+st.flossAnim+'" aria-label="牙線教學動畫"></button></div></div>'+
   musicCard()+
   '<div class="card"><h3>牙線（和牙間刷）放在</h3><div class="seg"><button data-act="flossSlot" data-slot="m" aria-pressed="'+(st.flossSlot==='m')+'">早上</button><button data-act="flossSlot" data-slot="e" aria-pressed="'+(st.flossSlot==='e')+'">晚上</button></div></div>'+
   '<div class="card"><div class="setting"><div><h3>提示音</h3><p class="muted small">換區時響一聲</p></div><button class="switch" data-act="toggleSound" aria-pressed="'+st.sound+'" aria-label="提示音"></button></div>'+
   '<div class="setting"><div><h3>震動</h3><p class="muted small">換區時震一下</p></div><button class="switch" data-act="toggleVibe" aria-pressed="'+st.vibe+'" aria-label="震動"></button></div></div>'+
   '<div class="card"><h3>紀錄</h3><p class="muted small">'+(storeMode==='account'?'紀錄存在你的帳號，換手機或瀏覽器也看得到。':'紀錄只存在這個瀏覽器，清除網站資料就會消失。')+'</p>'+
   (resetAsk?'<div class="row2"><button class="btn" data-act="resetNo">取消</button><button class="btn danger" data-act="resetYes">確定全部清除</button></div>':'<button class="btn" data-act="resetAsk">清除所有紀錄</button>')+'</div>'+
   installCard()+disclaimer();
}
function tabbar(){
  var T=[['today','今天',ICO.today],['log','紀錄',ICO.log],['shop','夥伴',ICO.shop],['set','設定',ICO.set]];
  return '<div class="tabbar"><nav>'+T.map(function(x){return '<button class="tab" data-act="tab" data-tab="'+x[0]+'" '+(tab===x[0]?'aria-current="page"':'')+'>'+x[2]+x[1]+'</button>';}).join('')+'</nav></div>';
}
function render(){
  var h=tab==='today'?viewToday():tab==='log'?viewLog():tab==='shop'?viewShop():viewSettings();
  $('#app').innerHTML='<div class="shell">'+h+'</div>'+tabbar();
}

/* ---------- events ---------- */
function act(a,d){
  if(a!=='buy'&&buyAsk){buyAsk=null;}
  if(a!=='resetAsk'&&a!=='resetYes'&&resetAsk&&a!=='tab'){resetAsk=false;}
  switch(a){
    case 'tab': tab=d.tab; if(tab==='log'){calM=null;selDay=todayStr();} resetAsk=false; pickFrom=null; render(); W.scrollTo(0,0); break;
    case 'slot': slotSel=d.slot; render(); break;
    case 'start': startSession(slotSel); break;
    case 'prepGo': openMusic(); beginBrush(); break;
    case 'countBack': stopTick(); sess.phase='prep'; renderSession(); break;
    case 'prepBack': case 'quitYes': case 'close': endSession(); break;
    case 'quit': if(sess.phase==='brush') pause(); sess.quitAsk=true; renderSession(); break;
    case 'quitNo': sess.quitAsk=false; renderSession(); break;
    case 'pause': if(sess.running) pause(); else resume(); break;
    case 'prev': jump(-1); break;
    case 'next': jump(1); break;
    case 'flossDone': nextStep('floss',true); break;
    case 'interNext': gapNext('inter'); break;
    case 'interPrev': gapPrev('inter'); break;
    case 'flossSkip': nextStep('floss',false); break;
    case 'interSkip': nextStep('inter',false); break;
    case 'calPrev': calM=new Date(calM.getFullYear(),calM.getMonth()-1,1); render(); break;
    case 'calNext': calM=new Date(calM.getFullYear(),calM.getMonth()+1,1); render(); break;
    case 'selday': selDay=d.day; render(); break;
    case 'buy':
      var b=BUDDIES.filter(function(x){return x.id===d.id;})[0];
      if(buyAsk===d.id){ if(b&&S.points>=b.price&&S.owned.indexOf(b.id)<0){ S.points-=b.price; S.owned.push(b.id); S.buddy=b.id; save(); } buyAsk=null; }
      else buyAsk=d.id;
      render(); break;
    case 'use': if(S.owned.indexOf(d.id)>=0){S.buddy=d.id; save();} render(); break;
    case 'secDec': S.settings.sec=Math.max(3,S.settings.sec-1); save(); render(); break;
    case 'secInc': S.settings.sec=Math.min(20,S.settings.sec+1); save(); render(); break;
    case 'brushType': S.settings.brushType=d.type; save(); render(); break;
    case 'flossSlot': S.settings.flossSlot=d.slot; save(); render(); break;
    case 'toggleRet': S.settings.ret[d.j].on=!S.settings.ret[d.j].on; pickFrom=null; save(); render(); break;
    case 'pickTooth':
      var pi=+d.i, pj=d.j, rr=S.settings.ret[pj];
      if(!pickFrom||pickFrom.j!==pj) pickFrom={j:pj,i:pi};
      else if(pickFrom.i!==pi){ rr.from=Math.min(pickFrom.i,pi); rr.to=Math.max(pickFrom.i,pi); pickFrom=null; save(); }
      else pickFrom=null;
      render(); break;
    case 'pickCancel': pickFrom=null; render(); break;
    case 'pickDefault': S.settings.ret[d.j].from=canR(d.j); S.settings.ret[d.j].to=canL(d.j); pickFrom=null; save(); render(); break;
    case 'teethDec': if(nOf(d.j)>12){ setTeeth(d.j,nOf(d.j)-2); pickFrom=null; save(); } render(); break;
    case 'teethInc': if(nOf(d.j)<16){ setTeeth(d.j,nOf(d.j)+2); pickFrom=null; save(); } render(); break;
    case 'toggleYt': S.settings.yt.on=!S.settings.yt.on; save(); render(); break;
    case 'toggleAnim': S.settings.flossAnim=!S.settings.flossAnim; save(); render(); break;
    case 'toggleSound': S.settings.sound=!S.settings.sound; save(); render(); break;
    case 'toggleVibe': S.settings.vibe=!S.settings.vibe; save(); render(); break;
    case 'resetAsk': resetAsk=true; render(); break;
    case 'resetNo': resetAsk=false; render(); break;
    case 'resetYes':
      S=fresh(); resetAsk=false; buyAsk=null; pickFrom=null; save(); render(); break;
    case 'install':
      if(installEvt){ var ev=installEvt; installEvt=null; ev.prompt(); ev.userChoice.then(render,render); }
      break;
  }
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b||b.disabled) return;
  act(b.getAttribute('data-act'),b.dataset);
});
document.addEventListener('input',function(e){
  if(e.target.id==='yturl'){ S.settings.yt.url=e.target.value.trim(); save(); }
});
document.addEventListener('change',function(e){
  if(e.target.id==='yturl') render();
});
document.addEventListener('visibilitychange',function(){
  if(!sess) return;
  if(document.hidden){ if(sess.phase==='brush'&&sess.running) pause(); if(sess.phase==='count') stopTick(); }
  else if(sess.phase!=='prep'&&sess.phase!=='done'){ lockScreen(); if(sess.phase==='count') startCount(); }
});

render();

/* ---------- PWA ---------- */
W.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); installEvt=e; if(!sess&&tab==='set') render(); });
W.addEventListener('appinstalled',function(){ installEvt=null; if(!sess&&tab==='set') render(); });
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  W.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

/* ---------- optional account storage ---------- */
(async function initStore(){
  try{
    if(!(W.claude&&typeof W.claude.use==='function')) return;
    var db=await W.claude.use('db'), user=await W.claude.use('user');
    if(!db||!user) return;
    var id=await user.id(); if(!id) return;
    var doc=db.doc('data/users/'+id+'/habit');
    var snap=await doc.get();
    dbDoc=doc; storeMode='account';
    if(snap.exists){
      var remote=null;
      try{ remote=JSON.parse((snap.data()||{}).json); }catch(e){}
      if(remote&&(remote.upd||0)>=(S.upd||0)){
        S=merge(fresh(),remote);
        try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      } else if(S.upd){ save(); }
    } else if(S.upd){ save(); }
    if(!sess) render();
  }catch(e){}
})();
})();
</script>
